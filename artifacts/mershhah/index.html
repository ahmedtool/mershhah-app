    <!-- Only IBM Plex Sans Arabic (the app-wide default, src/index.css's
         --app-font-sans) loads globally, at only the weights actually used
         (grepped src/**/*.tsx for font-* utility classes - 100/200/300/800
         are never used anywhere, and Inter isn't referenced by any
         component at all despite being loaded on every page before).
         Cairo/Tajawal are the two other public-menu font choices
         (src/lib/public-theme.ts's FONT_OPTIONS) - a restaurant using one
         of those loads it itself via useGoogleFont, only on its own public
         pages, instead of every page on the site paying for fonts almost
         nobody's menu actually uses. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) - the dataLayer/gtag() stub is set up
         immediately (it's just a local array push, costs nothing), but the
         actual gtag.js script - real network + parse + execute weight,
         confirmed by Lighthouse as ~66KB "unused" JS and real main-thread
         time - is only fetched after window 'load', once the page's own
         critical render is already done. Every gtag()/trackPageView() call
         made before then (including the very first pageview) still queues
         correctly into dataLayer and gets processed the moment the real
         script initializes - this queueing is gtag.js's own documented
         mechanism, not something specific to deferring it here. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view is off here - this is a client-routed SPA, so page
      // views are fired manually on route change (see trackPageView in
      // App.tsx), not just once on the initial full page load.
      gtag('config', 'G-11V9SH2EYQ', { send_page_view: false });

      window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-11V9SH2EYQ';
        document.head.appendChild(s);
      });
    </script>
  </head>
  <body>
    <!-- Applies a persisted language choice before React mounts, so an
         English-locale visitor doesn't see an RTL flash on load. Mirrors
         the same key/logic as LanguageContext.tsx's readStoredLocale(). -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('mershhah_locale') === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
